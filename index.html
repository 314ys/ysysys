<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 iPhone">
<title>내 iPhone</title>
<style>
  :root{ --blue:#007aff; --red:#ff3b30; --green:#34c759; --sub:#8e8e93; --line:#d8d8dc; --bg:#f2f2f7; --card:#fff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;height:100%;background:#000;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#000}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hide{display:none!important}
  #phone{position:fixed;inset:0;overflow:hidden;background:#111;--hb:26px}

  /* PC처럼 넓은 화면에서는 아이폰 13 비율(390×844)의 액자로 표시 */
  @media (min-width:500px){
    html,body{display:flex;align-items:center;justify-content:center;background:#1a1a1f}
    #phone{position:relative;inset:auto;height:min(844px,calc(100vh - 40px));aspect-ratio:390/844;
      border-radius:47px;box-shadow:0 0 0 10px #000,0 0 0 12px #3a3a3f,0 24px 60px rgba(0,0,0,.5)}
  }

  /* ================= 잠금화면 ================= */
  #lock,#home{position:absolute;inset:0;color:#fff;
    background:linear-gradient(160deg,#5b6dee 0%,#9b59d0 45%,#ff7eb3 100%)}
  #lock{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("lock.jpg") center/cover no-repeat}
  #lock{z-index:50;transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  #lock.gone{transform:translateY(-105%);pointer-events:none}
  .lk-lockicon{margin-top:calc(env(safe-area-inset-top) + 54px);opacity:.9}
  .lk-date{font-size:20px;font-weight:600;margin-top:10px;opacity:.92}
  .lk-time{font-size:88px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin-top:2px;
    text-shadow:0 2px 20px rgba(0,0,0,.15)}
  .lk-hint{margin-top:auto;margin-bottom:64px;font-size:16px;opacity:.85;animation:pulse 2.2s ease-in-out infinite}
  .lk-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;opacity:.9}
  @keyframes pulse{50%{opacity:.35}}
  /* 비밀번호 키패드 */
  #pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top) + 100px);
    background:rgba(0,0,0,.3);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .25s;cursor:default}
  #pw.show{opacity:1;pointer-events:auto}
  #pw .pt{font-size:20px;font-weight:500}
  .dots{display:flex;gap:22px;margin:20px 0 70px}
  .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}
  .dots i.on{background:#fff}
  .dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
  .kp{display:grid;grid-template-columns:repeat(3,74px);gap:16px 22px}
  .kp button{width:74px;height:74px;border-radius:50%;border:.5px solid rgba(255,255,255,.28);color:#fff;
    background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;
    font-size:34px;font-weight:300;transition:background .15s}
  .kp button small{font-size:10px;font-weight:700;letter-spacing:2px;margin-top:3px;min-height:10px}
  .kp button:active{background:rgba(255,255,255,.5)}
  .pwfoot{width:calc(3*74px + 2*22px);display:flex;justify-content:space-between;margin-top:30px}
  .pwfoot button{background:none;border:0;color:#fff;font-size:17px;padding:8px 4px}
  .lk-date,.lk-time,.lk-lockicon{transition:opacity .25s}
  #lock.pwmode .lk-date,#lock.pwmode .lk-time,#lock.pwmode .lk-lockicon{opacity:0}
  #lock.pwmode .lk-hint{animation:none;opacity:0}

  /* ================= 홈화면 ================= */
  #home{z-index:1}
  .sb{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 26px 0;font-weight:600;font-size:16px;height:calc(env(safe-area-inset-top) + 38px)}
  .sb .time{cursor:pointer}
  .widget{margin:18px 22px 6px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .widget .wd{font-size:14px;opacity:.9}
  .widget .wt{font-size:40px;font-weight:700;letter-spacing:-1px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:20px 18px}
  .ico{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font-size:12px;padding:0}
  .ico .sq{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .ico:active .sq{transform:scale(.92);filter:brightness(.9)}
  .ico svg{width:34px;height:34px}
  .ico span{text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .ico .sq{overflow:hidden}
  .ico .sq img{width:100%;height:100%;object-fit:cover;display:block}
  .ico.locked{pointer-events:none}
  .calico{width:100%;height:100%;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .calico b{font-size:11px;font-weight:600;color:#ff3b30;margin-bottom:2px}
  .calico span{font-size:30px;font-weight:300}

  /* 홈 위젯 */
  .wrow{display:flex;gap:14px;padding:16px 22px 0}
  .wcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .wlabel{font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .wrow .widget{margin:0;width:100%;aspect-ratio:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:26px}
  .wcal{width:100%;aspect-ratio:1;border:0;border-radius:26px;background:#fff;color:#000;padding:12px 14px;text-align:left;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
  .wc-day{font-size:14px;font-weight:600}
  .wc-num{font-size:40px;font-weight:300;line-height:1.05}
  .wc-ev{margin-top:6px;display:flex;flex-direction:column;gap:5px;min-height:0}
  .wev{border-left:3px solid var(--c);background:#eef5fc;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:6px;padding:3px 7px;display:flex;flex-direction:column;overflow:hidden}
  .wev b{font-size:11px;font-weight:700;color:#1c1c1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wev span{font-size:10.5px;color:var(--c)}
  .wnone{font-size:12px;color:#8e8e93}

  /* 홈 인디케이터 */
  #hb{position:absolute;bottom:0;left:0;right:0;height:var(--hb);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
  #hb i{display:block;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.9)}
  #hb.dark i{background:#000;opacity:.85}
  #hb.on{cursor:pointer}

  /* ================= 앱 공통 ================= */
  .app{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
    transform:scale(.3);opacity:0;pointer-events:none;border-radius:40px;
    transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s,border-radius .38s}
  .app.open{transform:scale(1);opacity:1;pointer-events:auto;border-radius:0}
  .appnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;min-height:56px;flex:none}
  .appnav .t{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appnav .nb{background:none;border:0;color:var(--blue);font-size:17px;padding:6px 2px;min-width:44px}
  .appnav .nb.r{text-align:right}.appnav .nb.l{text-align:left}
  .appnav .nb.danger{color:var(--red)}
  .appnav .nb:disabled{color:var(--sub)}
  .big{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:0 18px 10px}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--hb) + 10px)}
  .group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
  .row{display:flex;gap:12px;padding:11px 14px;align-items:center;position:relative;cursor:pointer}
  .row:active{background:rgba(120,120,128,.14)}
  .row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--line)}
  .av{width:44px;height:44px;border-radius:50%;flex:none;color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center}
  .row .b{flex:1;min-width:0}
  .row .n{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .p{color:var(--sub);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .row .tm{color:var(--sub);font-size:14px;flex:none;align-self:flex-start;margin-top:2px}
  .empty{text-align:center;color:var(--sub);padding:90px 28px;line-height:1.7;font-size:16px}
  .plus{background:none;border:0;color:var(--blue);font-size:30px;line-height:1;padding:0 4px;min-width:44px;text-align:right}

  /* ================= 채팅 ================= */
  #app-chat{background:#dfe7f1}
  #app-chat .appnav{background:rgba(223,231,241,.92)}
  #chatList{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg)}
  #chatRoom{display:flex;flex-direction:column;flex:1;min-height:0}
  #cmsgs{flex:1;overflow-y:auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
  .m{display:flex;gap:8px;max-width:84%;align-items:flex-end}
  .m.me{align-self:flex-end;flex-direction:row-reverse}
  .m .av{width:36px;height:36px;font-size:15px;align-self:flex-start}
  .m .nm{font-size:12px;color:#555;margin:0 4px 3px}
  .bub{padding:8px 12px;border-radius:16px;font-size:16px;line-height:1.38;white-space:pre-wrap;word-break:break-word;background:#fff}
  .me .bub{background:#ffe778;border-top-right-radius:4px}
  .them .bub{border-top-left-radius:4px}
  .m .mt{font-size:11px;color:#6b7785;flex:none}
  .cbar{display:flex;gap:8px;align-items:center;padding:8px 10px calc(var(--hb) + 6px);background:#fff;border-top:.5px solid var(--line)}
  .cbar input{flex:1;border:0;background:#f0f1f3;border-radius:18px;padding:9px 14px;outline:none;font-size:16px}
  .who{border:0;background:#e8eaee;border-radius:14px;font-size:13px;padding:7px 11px;font-weight:600;flex:none}
  .who.me{background:#ffe778}
  .sendb{border:0;background:var(--blue);color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
  .sendb:disabled{background:#c7c7cc}

  /* ================= 피드 ================= */
  #app-feed{background:#fff}
  .post{border-bottom:.5px solid var(--line);padding-bottom:12px}
  .ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
  .ph .av{width:34px;height:34px;font-size:14px}
  .ph .n{font-weight:600;font-size:15px;flex:1}
  .ph .del{border:0;background:none;color:var(--sub);font-size:13px}
  .post img.pi{width:100%;display:block;max-height:480px;object-fit:cover;background:#eee}
  .pa{display:flex;gap:14px;padding:10px 14px 2px}
  .pa button{background:none;border:0;padding:0;font-size:26px;line-height:1}
  .pa .liked{color:#ff2d55}
  .pt{padding:2px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .pd{padding:4px 14px 0;font-size:12px;color:var(--sub)}

  /* ================= 메모 ================= */
  #app-notes{background:#f2f2f7}
  .nview{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
  .nview svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nview svg.i3{fill:currentColor;stroke:none}
  .ntop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;flex:none}
  .cbtn{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#000;box-shadow:0 4px 16px rgba(0,0,0,.08);
    display:flex;align-items:center;justify-content:center;padding:0;flex:none}
  .cbtn.lg{width:56px;height:56px}
  .cbtn svg,.pillbtn svg,.tools svg{width:24px;height:24px}
  .ntitle{text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
  .ntitle b{font-size:17px}
  .ntitle span{font-size:15px;color:#8e8e93}
  .pillbtn,.tools,.nsearch{background:#fff;border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,.08);display:flex;align-items:center}
  .pillbtn{height:52px;padding:0 6px}
  .pillbtn button,.tools button{border:0;background:none;color:#000;width:52px;height:52px;display:flex;align-items:center;justify-content:center;padding:0}
  .tools{height:56px;padding:0 8px}
  .cbtn:active,.pillbtn button:active,.tools button:active{opacity:.55}
  .nscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 140px}
  .nsec{font-size:22px;font-weight:700;margin:22px 4px 10px}
  .ncard{background:#fff;border-radius:26px;overflow:hidden}
  .nrow{padding:14px 20px;position:relative;cursor:pointer}
  .nrow:active{background:rgba(120,120,128,.12)}
  .nrow+.nrow::before{content:"";position:absolute;top:0;left:20px;right:20px;height:.5px;background:#d8d8dc}
  .nrow .nt{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nrow .ns{font-size:15px;color:#8e8e93;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nrow .ns b{font-weight:400;color:#6c6c70;margin-right:8px}
  .nrow .nf{display:flex;align-items:center;gap:6px;font-size:15px;color:#8e8e93;margin-top:4px}
  .nempty{text-align:center;color:#8e8e93;padding:90px 20px;line-height:1.7}
  .nbar{position:absolute;left:16px;right:16px;bottom:calc(var(--hb) + 10px);display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:2}
  .nsearch{flex:1;height:56px;padding:0 18px;gap:10px;color:#6c6c70}
  .nsearch input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:17px}
  .nsearch svg{width:22px;height:22px;flex:none}
  #nText{flex:1;border:0;outline:none;background:none;padding:18px 24px 150px;font-size:17px;line-height:1.55;resize:none;color:#333}

  /* ================= 갤러리 ================= */
  #app-gallery{background:#fff}
  .gg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .gg button{padding:0;border:0;background:#eee;aspect-ratio:1;overflow:hidden}
  .gg img{width:100%;height:100%;object-fit:cover;display:block}
  #gView{position:absolute;inset:0;background:#000;z-index:5;display:flex;flex-direction:column}
  #gView .appnav .nb{color:#fff}
  #gView .appnav .t{color:#ddd;font-size:14px;font-weight:500}
  #gImg{flex:1;min-height:0;width:100%;object-fit:contain;padding-bottom:var(--hb)}

  /* ================= 전화 ================= */
  #app-phone{background:#fff}
  #pBody{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
  .phead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;flex:none}
  .phead>:first-child{justify-self:start}
  .phead>:last-child{justify-self:end}
  .ptitle{font-size:17px;font-weight:600}
  .ppill{height:50px;padding:0 20px;border-radius:25px;border:0;background:#fff;color:#000;font-size:17px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .pcirc{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#000;box-shadow:0 4px 16px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;padding:0}
  .pcirc svg{width:24px;height:24px}
  .pcirc.act{color:#2f7df6}
  .pspacer{width:52px}
  .plist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 130px}
  .pempty{text-align:center;color:#8e8e93;padding:90px 24px;line-height:1.7}

  /* 아바타 / 행 */
  .pav{width:54px;height:54px;border-radius:50%;background:linear-gradient(#a3abe0,#6f7ac4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;flex:none}
  .pav svg{width:62%;height:62%}
  .pav.xl{width:120px;height:120px;font-size:42px}
  .prow,.crow{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative;cursor:pointer}
  .prow+.prow::before,.crow+.crow::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:#d8d8dc}
  .pmid{flex:1;min-width:0}
  .pname{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .psub{display:flex;align-items:center;gap:6px;font-size:15px;color:#8e8e93;margin-top:2px}
  .pdate{font-size:15px;color:#8e8e93;flex:none}
  .pcallbtn{width:52px;height:52px;border-radius:50%;border:0;background:#f0f0f3;color:#2f7df6;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
  .pcallbtn svg{width:22px;height:22px}
  .pdel{border:0;background:none;color:#ff3b30;font-size:16px;flex:none;padding:8px}

  /* 연락처 */
  .psbar{margin:0 16px 8px;height:44px;border-radius:22px;background:#f2f2f7;display:flex;align-items:center;gap:8px;padding:0 14px;color:#8e8e93;flex:none}
  .psbar svg{width:18px;height:18px;flex:none}
  .psbar input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:17px}
  .psec{font-size:15px;font-weight:700;color:#8e8e93;margin:16px 0 2px}
  .pcount{text-align:center;color:#8e8e93;font-size:15px;margin:24px 0 8px}
  .pdetail{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:10px 20px 40px}
  .dname{font-size:28px;font-weight:700;margin:14px 0 18px;text-align:center}
  .dact{display:flex;gap:14px;margin-bottom:22px}
  .dbtn{width:76px;height:64px;border-radius:16px;border:0;background:#f2f2f7;color:#2f7df6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
  .dbtn svg{width:22px;height:22px}
  .dcard{align-self:stretch;background:#f2f2f7;border-radius:16px;padding:12px 16px;margin-bottom:12px}
  .dl{font-size:13px;color:#8e8e93}
  .dv{font-size:18px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
  .ddel{margin-top:10px;align-self:stretch;border:0;background:#f2f2f7;color:#ff3b30;border-radius:16px;padding:14px;font-size:17px}

  /* 키패드 */
  .pkp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(var(--hb) + 96px)}
  .pdisp{font-size:36px;min-height:48px;letter-spacing:.5px;text-align:center;padding:0 20px;word-break:break-all}
  .paddc{height:30px;margin-bottom:14px}
  .paddc button{border:0;background:none;color:#2f7df6;font-size:17px}
  .pgrid{display:grid;grid-template-columns:repeat(3,78px);gap:18px 24px}
  .pkey{width:78px;height:78px;border-radius:50%;border:0;background:#fafafa;box-shadow:0 8px 28px rgba(0,0,0,.08);color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
  .pkey:active{background:#e3e3e8}
  .pkey .n{font-size:38px;font-weight:400}
  .pkey .l{font-size:11px;font-weight:700;letter-spacing:3px;margin-top:3px;text-indent:3px}
  .pcallrow{display:grid;grid-template-columns:repeat(3,78px);gap:0 24px;margin-top:22px;align-items:center;justify-items:center}
  .pcall{width:78px;height:78px;border-radius:50%;border:0;background:#67d06a;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
  .pcall svg{width:34px;height:34px}

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const DAYS = ['일','월','화','수','목','금','토'];
  const COLORS = ['#ff9500','#34c759','#5856d6','#ff2d55','#00b8a9','#af52de','#007aff','#a2845e'];

  /* ---------- 저장소 ---------- */
  const DB = {
    get(k,d){ try{ const v = JSON.parse(localStorage.getItem('myphone.'+k)); return v==null ? d : v; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem('myphone.'+k, JSON.stringify(v)); return true; }
              catch(e){ toast('저장 공간이 부족해요. 사진을 몇 장 지워주세요'); return false; } }
  };
  let chats = DB.get('chats',[]), posts = DB.get('posts',[]), notes = DB.get('notes',[]),
      photos = DB.get('photos',[]), recents = DB.get('recents',[]), contacts = DB.get('contacts',[]);
  /* ---------- 기본 데이터 (링크로 들어온 모든 사람에게 처음부터 보임) ---------- */
  const SEED_VERSION = 'v1';     // 아래 데이터를 고친 뒤 'v2', 'v3'… 로 올리면 모두에게 새로 반영돼요
  const T = (m,d,h,mi) => new Date(2026,m-1,d,h,mi).getTime();
  const NUM = '01000000000';
  const rec = (n,cid,at,dur) => ({id:'seed-r'+n, cid, num:NUM, at, dur});
  const SEED_CONTACTS = [
    {id:'seed-c1',  name:'과장님',   num:NUM, memo:''},
    {id:'seed-c2',  name:'나비관',   num:NUM, memo:''},
    {id:'seed-c3',  name:'누구지',   num:NUM, memo:''},
    {id:'seed-c4',  name:'누군데',   num:NUM, memo:''},
    {id:'seed-c5',  name:'단',       num:NUM, memo:'사슴관'},
    {id:'seed-c6',  name:'송화누나', num:NUM, memo:'파트너'},
    {id:'seed-c7',  name:'아빠',     num:NUM, memo:''},
    {id:'seed-c8',  name:'엄마',     num:NUM, memo:''},
    {id:'seed-c9',  name:'큰아버지', num:NUM, memo:'경무과'},
    {id:'seed-c10', name:'파트너',   num:NUM, memo:''},
    {id:'seed-c11', name:'X',        num:NUM, memo:''}
  ];
  const SEED_RECENTS = [
    rec(1,  'seed-c6', T(10,26,13,42), 187),
    rec(2,  'seed-c6', T(10,26,21,15), 642),
    rec(3,  'seed-c6', T(10,27,12,20), 273),
    rec(4,  'seed-c8', T(10,27,19, 8), 411),    // 엄마
    rec(5,  'seed-c6', T(10,28, 9,14),  58),
    rec(6,  'seed-c7', T(10,28,18,25), 232),    // 아빠
    rec(7,  'seed-c6', T(10,28,22,47), 905),
    rec(8,  'seed-c6', T(10,29,20,33), 1264),
    rec(9,  'seed-c6', T(10,30, 7,48), 121),
    rec(10, 'seed-c6', T(10,30,23, 5), 788),
    rec(11, 'seed-c6', T(10,31,10,37), 143),
    rec(12, 'seed-c6', T(10,31,20,12), 1012)
  ];
  // 모두에게 보일 캘린더 일정. 예: {date:'2026-11-05', title:'제목', time:'09:00~10:50'}
  const SEED_EVENTS = [];

  if(DB.get('seed','') !== SEED_VERSION){
    const first = !DB.get('seed','');
    const names = new Set(SEED_CONTACTS.map(c=>c.name));
    contacts = contacts.filter(c=>!String(c.id).startsWith('seed-') && !names.has(c.name)).concat(SEED_CONTACTS);
    recents  = (first ? [] : recents.filter(r=>!String(r.id).startsWith('seed-'))).concat(SEED_RECENTS);
    DB.set('contacts',contacts); DB.set('recents',recents); DB.set('seed',SEED_VERSION);
  }

  /* ---------- 유틸 ---------- */

        img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');

      try{ const img=await readImage(f,1000,.75); photos.push({id:uid(),img,at:Date.now()});
           if(!DB.set('photos',photos)){ photos.pop(); break; } added++; }
      catch(err){ toast('불러오지 못한 사진이 있어요'); }
    }
    if(added) toast('사진 '+added+'장을 저장했어요'); R.gallery();
  });
  $('#gGrid').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return; const p=photos.find(x=>x.id===b.dataset.id); if(!p) return;
    viewId=p.id; $('#gImg').src=p.img; $('#gDate').textContent=full(p.at); $('#gView').classList.remove('hide');
  });
  $('#gClose').addEventListener('click', ()=>{ $('#gView').classList.add('hide'); viewId=null; });
  $('#gDel').addEventListener('click', ()=>{ if(confirm('이 사진을 삭제할까요?')){ photos=photos.filter(p=>p.id!==viewId); DB.set('photos',photos); $('#gView').classList.add('hide'); viewId=null; R.gallery(); } });

  /* =====================================================
     전화
  ===================================================== */
  let ptab='keypad', dial='', contactId=null, editing=false, onlyKnown=false, cQuery='';
  let callT=null, callStart=0, callWho=null;

  const norm = s => String(s).replace(/[^\d*#+]/g,'');
  const findContact = num => { const n=norm(num); return n ? contacts.find(c=>norm(c.num)===n) : null; };
  const nameOf = num => { const c=findContact(num); return c ? c.name : ''; };
  const recName = r => { const c = r.cid ? contacts.find(x=>x.id===r.cid) : null; return c ? c.name : nameOf(r.num); };
  const abbr = n => n.length<=2 ? n : n.slice(-2);
  function fmtNum(s){
    if(!/^\d+$/.test(s)) return s;
    if(s.startsWith('010')||s.startsWith('011')) return [s.slice(0,3),s.slice(3,7),s.slice(7,11)].filter(Boolean).join('-');
    return s;
  }
  function callDate(t){
    const d=new Date(t), sod=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
    const df=Math.round((sod(new Date())-sod(d))/86400000);
    if(df<=0) return pad(d.getHours())+':'+pad(d.getMinutes());
    if(df===1) return '어제';
    if(df<7) return DAYS[d.getDay()]+'요일';
    return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.';
  }
  const IC = {
    phone:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
    person:'<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7z"/></svg>',
    out:'<svg viewBox="0 0 12 12" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l6-6M4 3h5v5"/></svg>',
    bk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h10a2 2 0 012 2v8a2 2 0 01-2 2H9l-6-6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>',
    filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>'
  };
  const avHTML = (name,size) => '<div class="pav'+(size?' '+size:'')+'">'+(name ? '<span>'+esc(abbr(name))+'</span>' : IC.person)+'</div>';
  const KEYS=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];

  /* ----- 화면 만들기 ----- */
  function viewKeypad(){
    return '<div class="pkp"><div class="pdisp">'+esc(fmtNum(dial))+'</div>'+
      '<div class="paddc">'+(dial?'<button id="addNum">연락처에 추가</button>':'')+'</div>'+
      '<div class="pgrid">'+KEYS.map(k=>'<button class="pkey" data-k="'+k[0]+'"><span class="n">'+k[0]+'</span>'+(k[1]?'<span class="l">'+k[1]+'</span>':'')+'</button>').join('')+'</div>'+
      '<div class="pcallrow"><span></span><button class="pcall" data-k="call" aria-label="전화 걸기">'+IC.phone+'</button>'+
      (dial?'<button class="pbk" data-k="bk" aria-label="지우기">'+IC.bk+'</button>':'<span></span>')+'</div></div>';
  }
  function viewRecent(){
    let items=recents.slice().sort((a,b)=>b.at-a.at);
    if(onlyKnown) items=items.filter(r=>recName(r));
    return '<div class="phead"><button class="ppill" id="pEdit">'+(editing?'완료':'편집')+'</button><div class="ptitle">통화</div>'+
      '<button class="pcirc'+(onlyKnown?' act':'')+'" id="pFilter" aria-label="저장된 연락처만 보기">'+IC.filter+'</button></div>'+
      '<div class="plist">'+(items.length ? items.map(r=>{
        const nm=recName(r);
        return '<div class="prow" data-id="'+r.id+'" data-cid="'+esc(r.cid||'')+'" data-num="'+esc(r.num)+'">'+avHTML(nm)+
          '<div class="pmid"><div class="pname">'+esc(nm||fmtNum(r.num))+'</div><div class="psub">'+IC.out+(nm?'휴대전화':'발신')+'</div></div>'+
          '<div class="pdate">'+callDate(r.at)+'</div>'+
          (editing ? '<button class="pdel" data-a="del">삭제</button>' : '<button class="pcallbtn" data-a="call" aria-label="전화">'+IC.phone+'</button>')+'</div>';
      }).join('') : '<div class="pempty">'+(onlyKnown?'저장된 연락처와의 통화가 없어요':'통화 기록이 없어요<br>키패드에서 전화를 걸어보세요')+'</div>')+'</div>';
  }
  const HAN_ORDER=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const CHO=['ㄱ','ㄱ','ㄴ','ㄷ','ㄷ','ㄹ','ㅁ','ㅂ','ㅂ','ㅅ','ㅅ','ㅇ','ㅈ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const GROUP_ORDER=HAN_ORDER.concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),['#']);
  function groupKey(name){
    const ch=name.trim()[0]||'#', code=ch.charCodeAt(0);
    if(code>=0xAC00 && code<=0xD7A3) return CHO[Math.floor((code-0xAC00)/588)];
    if(/[A-Za-z]/.test(ch)) return ch.toUpperCase();
    return '#';
  }
  function contactListHTML(){
    const q=cQuery.trim().toLowerCase(), nq=norm(q);
    const list=contacts.filter(c=>!q || c.name.toLowerCase().includes(q) || (nq && norm(c.num).includes(nq)));
    if(!list.length) return '<div class="pempty">'+(q?'검색 결과가 없어요':'저장된 연락처가 없어요<br>오른쪽 위 ＋ 로 추가해보세요')+'</div>';
    const gs={}; list.forEach(c=>{ const k=groupKey(c.name); (gs[k]=gs[k]||[]).push(c); });
    return GROUP_ORDER.filter(k=>gs[k]).map(k=>
      '<div class="psec">'+k+'</div><div>'+gs[k].sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(c=>
        '<div class="crow" data-id="'+c.id+'">'+avHTML(c.name)+'<div class="pmid"><div class="pname">'+esc(c.name)+'</div></div></div>').join('')+'</div>'
    ).join('')+'<div class="pcount">연락처 '+contacts.length+'명</div>';
  }
  function viewContacts(){
    return '<div class="phead"><span class="pspacer"></span><div class="ptitle">연락처</div><button class="pcirc" id="cAdd" aria-label="연락처 추가">'+IC.plus+'</button></div>'+
      '<label class="psbar">'+IC.search+'<input id="cSearch" type="search" placeholder="검색" value="'+esc(cQuery)+'" autocomplete="off"></label>'+
      '<div class="plist" id="cList">'+contactListHTML()+'</div>';
  }
  function viewDetail(){
    const c=contacts.find(x=>x.id===contactId); if(!c){ contactId=null; return viewContacts(); }
    return '<div class="phead"><button class="ppill" id="dBack">‹ 연락처</button><span></span><button class="ppill" id="dEdit">편집</button></div>'+
      '<div class="pdetail">'+avHTML(c.name,'xl')+'<div class="dname">'+esc(c.name)+'</div>'+
      '<div class="dact"><button class="dbtn" data-a="call">'+IC.phone+'전화</button></div>'+
      '<div class="dcard"><div class="dl">휴대전화</div><div class="dv">'+esc(fmtNum(c.num))+'</div></div>'+
      (c.memo ? '<div class="dcard"><div class="dl">메모</div><div class="dv">'+esc(c.memo)+'</div></div>' : '')+
      '<button class="ddel" id="dDel">연락처 삭제</button></div>';
  }
  function renderPhone(){
    const inDetail = ptab==='contacts' && contactId;
    $('#pnav').classList.toggle('hide', !!inDetail);
    $('#ptabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.t===ptab));
    $('#pBody').innerHTML = ptab==='keypad' ? viewKeypad() : ptab==='recent' ? viewRecent() : (inDetail ? viewDetail() : viewContacts());
  }
  R.phone = function(){ ptab='keypad'; contactId=null; editing=false; dial=''; renderPhone(); };   // 앱을 열 때 항상 키패드부터

  /* ----- 연락처 저장 / 편집 ----- */
  function addContact(num){
    openSheet({title:'새 연락처', saveLabel:'완료',
      fields:[{key:'name',ph:'이름',req:true,max:20},{key:'num',type:'tel',ph:'전화번호',req:true,val:num||'',max:20},{key:'memo',type:'area',ph:'메모'}],
      onSave:v=>{ contacts.push({id:uid(),name:v.name.trim(),num:norm(v.num),memo:String(v.memo||'').trim()}); DB.set('contacts',contacts); toast('연락처를 저장했어요'); renderPhone(); }});
  }
  function editContact(id){
    const c=contacts.find(x=>x.id===id); if(!c) return;
    openSheet({title:'연락처 편집', saveLabel:'완료',
      fields:[{key:'name',ph:'이름',req:true,max:20,val:c.name},{key:'num',type:'tel',ph:'전화번호',req:true,max:20,val:c.num},{key:'memo',type:'area',ph:'메모',val:c.memo||''}],
      onSave:v=>{ c.name=v.name.trim(); c.num=norm(v.num); c.memo=String(v.memo||'').trim(); DB.set('contacts',contacts); toast('저장했어요'); renderPhone(); }});
  }

  /* ----- 클릭 처리 ----- */
  $('#pBody').addEventListener('click', e=>{
    const t=e.target, kb=t.closest('[data-k]');
    if(kb){
      const v=kb.dataset.k;
      if(v==='call'){ if(dial) startCall(dial); }
      else if(v==='bk'){ dial=dial.slice(0,-1); renderPhone(); }
      else if(dial.length<20){ dial+=v; renderPhone(); }
      return;
    }
    if(t.closest('#addNum')) return addContact(dial);
    if(t.closest('#pEdit')){ editing=!editing; return renderPhone(); }
    if(t.closest('#pFilter')){ onlyKnown=!onlyKnown; return renderPhone(); }
    if(t.closest('#cAdd')) return addContact('');
    if(t.closest('#dBack')){ contactId=null; return renderPhone(); }
    if(t.closest('#dEdit')) return editContact(contactId);
    if(t.closest('#dDel')){
      if(confirm('이 연락처를 삭제할까요?')){ contacts=contacts.filter(c=>c.id!==contactId); DB.set('contacts',contacts); contactId=null; renderPhone(); }
      return;
    }
    const a=t.closest('[data-a]'), prow=t.closest('.prow');
    if(a && prow){
      if(a.dataset.a==='call') return startCall(prow.dataset.num, prow.dataset.cid);
      if(a.dataset.a==='del'){ recents=recents.filter(r=>r.id!==prow.dataset.id); DB.set('recents',recents); return renderPhone(); }
    }
    if(a && a.dataset.a==='call' && contactId){ const c=contacts.find(x=>x.id===contactId); if(c) startCall(c.num, c.id); return; }
    if(prow && !editing){ const c=contacts.find(x=>x.id===prow.dataset.cid) || findContact(prow.dataset.num); if(c){ ptab='contacts'; contactId=c.id; renderPhone(); } return; }
    const crow=t.closest('.crow'); if(crow){ contactId=crow.dataset.id; renderPhone(); }
  });
  $('#pBody').addEventListener('input', e=>{ if(e.target.id==='cSearch'){ cQuery=e.target.value; $('#cList').innerHTML=contactListHTML(); } });
  $('#ptabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; ptab=b.dataset.t; contactId=null; editing=false; renderPhone(); });
  $('#pSearchBtn').addEventListener('click', ()=>{ ptab='contacts'; contactId=null; renderPhone(); const i=$('#cSearch'); if(i) i.focus(); });

  /* ----- 통화 ----- */
  let callCid=null;
  function startCall(num, cid){
    callWho=num; callCid=cid || (findContact(num)||{}).id || null; callStart=Date.now();
    const c=callCid ? contacts.find(x=>x.id===callCid) : null;
    $('#callName').textContent = c ? c.name : fmtNum(num); $('#callSt').textContent='전화 거는 중…';
    $('#calling').classList.remove('hide');
    callT=setInterval(()=>{ const s=Math.floor((Date.now()-callStart)/1000); if(s>=2) $('#callSt').textContent=pad(Math.floor(s/60))+':'+pad(s%60); },500);
  }
  function endCall(silent){
    if(callWho===null) return; clearInterval(callT);
    const dur=Math.max(0,Math.floor((Date.now()-callStart)/1000));
    recents.push({id:uid(),num:callWho,cid:callCid,at:Date.now(),dur}); if(recents.length>100) recents.shift(); DB.set('recents',recents);
    callWho=null; callCid=null; $('#calling').classList.add('hide'); dial='';
    if(!silent){ ptab='recent'; renderPhone(); toast('통화 기록이 저장됐어요'); }
  }
  $('#callEnd').addEventListener('click', ()=>endCall(false));

  /* =====================================================
     캘린더 (2026년 10월 ~ 2027년 1월)
  ===================================================== */
  const CAL_MIN=[2026,9], CAL_MAX=[2027,0];                 // [연, 월(0부터)]
  let events = DB.get('events',[]);
  let calY=2026, calM=9, calSel='';
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const inRange = (y,m) => { const v=y*12+m; return v>=CAL_MIN[0]*12+CAL_MIN[1] && v<=CAL_MAX[0]*12+CAL_MAX[1]; };
  const allEvents = () => SEED_EVENTS.map(e=>Object.assign({seed:true,id:'seed-'+e.date+e.title},e)).concat(events);
  const evsOf = ds => allEvents().filter(e=>e.date===ds).sort((a,b)=>(a.time||'~').localeCompare(b.time||'~')||a.title.localeCompare(b.title,'ko'));
  const evColor = e => color(e.title);

  function calReset(){
    const now=new Date(); let y=now.getFullYear(), m=now.getMonth(), v=y*12+m;
    if(v<CAL_MIN[0]*12+CAL_MIN[1]){ y=CAL_MIN[0]; m=CAL_MIN[1]; } else if(v>CAL_MAX[0]*12+CAL_MAX[1]){ y=CAL_MAX[0]; m=CAL_MAX[1]; }
    calY=y; calM=m; calSel = (now.getFullYear()===y && now.getMonth()===m) ? ymd(now) : ymd(new Date(y,m,1));
  }
  function renderCal(){
    $('#calTitle').textContent = calY+'년 '+(calM+1)+'월';
    $('#calPrev').disabled = !inRange(calM===0?calY-1:calY, calM===0?11:calM-1);
    $('#calNext').disabled = !inRange(calM===11?calY+1:calY, calM===11?0:calM+1);
    const todayS=ymd(new Date()), start=new Date(calY,calM,1-new Date(calY,calM,1).getDay()), all=allEvents();
    let h='';
    for(let i=0;i<42;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), ds=ymd(d), out=d.getMonth()!==calM;
      const dots = out ? '' : all.filter(e=>e.date===ds).slice(0,3).map(e=>'<i style="--c:'+evColor(e)+'"></i>').join('');
      h+='<button class="cc'+(out?' out':'')+(ds===todayS?' today':'')+(ds===calSel?' sel':'')+(d.getDay()===0?' sun':'')+'" data-d="'+ds+'"'+(out?' disabled':'')+
         '><span class="n">'+d.getDate()+'</span><span class="cdots">'+dots+'</span></button>';
    }
    $('#calGrid').innerHTML=h; renderDay();
  }
  function renderDay(){
    const d=new Date(calSel+'T00:00:00'), evs=evsOf(calSel);
    $('#calSelTitle').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';
    $('#calEvs').innerHTML = evs.length ? evs.map(e=>
      '<div class="cev" style="--c:'+evColor(e)+'"><div class="t"><b>'+esc(e.title)+'</b>'+(e.time?'<span>'+esc(e.time)+'</span>':'')+'</div>'+
      (e.seed ? '<span class="tag">공용</span>' : '<button data-del="'+e.id+'">삭제</button>')+'</div>').join('') : '<div class="cnone">일정이 없어요</div>';
  }
  function calGo(step){
    let y=calY, m=calM+step; if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    if(!inRange(y,m)) return;
    calY=y; calM=m; const now=new Date();
    calSel = (now.getFullYear()===y && now.getMonth()===m) ? ymd(now) : ymd(new Date(y,m,1));
    renderCal();
  }
  R.calendar = function(){ calReset(); renderCal(); };

  $('#calPrev').addEventListener('click', ()=>calGo(-1));
  $('#calNext').addEventListener('click', ()=>calGo(1));
  $('#calGrid').addEventListener('click', e=>{ const b=e.target.closest('.cc'); if(!b || b.disabled) return; calSel=b.dataset.d; renderCal(); });
  $('#calAdd').addEventListener('click', ()=>openSheet({title:'새 일정', saveLabel:'저장',
    fields:[{key:'title',ph:'제목',req:true,max:30},{key:'date',type:'date',req:true,val:calSel},{key:'time',ph:'시간 (예: 09:00~10:50, 비워도 돼요)',max:20}],
    onSave:v=>{
      const p=String(v.date).split('-').map(Number);
      if(p.length<3 || !inRange(p[0],p[1]-1)){ toast('2026년 10월 ~ 2027년 1월만 가능해요'); return; }
      events.push({id:uid(),date:v.date,title:v.title.trim(),time:String(v.time||'').trim()}); DB.set('events',events);
      calY=p[0]; calM=p[1]-1; calSel=v.date; renderCal(); refreshCal(); toast('일정을 저장했어요');
    }}));
  $('#calEvs').addEventListener('click', e=>{
    const id=e.target.dataset.del; if(!id) return;
    if(confirm('이 일정을 삭제할까요?')){ events=events.filter(x=>x.id!==id); DB.set('events',events); renderCal(); refreshCal(); }
  });

  /* 홈 화면 캘린더 위젯 + 앱 아이콘의 날짜 */
  function refreshCal(){
    const now=new Date(), evs=evsOf(ymd(now));
    $('#wcDay').textContent=DAYS[now.getDay()]+'요일';
    $('#wcNum').textContent=now.getDate();
    $('#wcEv').innerHTML = !evs.length ? '<div class="wnone">일정 없음</div>' :
      evs.slice(0,2).map(e=>'<div class="wev" style="--c:'+evColor(e)+'"><b>'+esc(e.title)+'</b>'+(e.time?'<span>'+esc(e.time)+'</span>':'')+'</div>').join('')+
      (evs.length>2 ? '<div class="wnone">+'+(evs.length-2)+'개 더</div>' : '');
    const ci=document.querySelector('.calico'); if(ci) ci.innerHTML='<b>'+DAYS[now.getDay()]+'</b><span>'+now.getDate()+'</span>';
  }
  $('#wCal').addEventListener('click', ()=>{
    const r=$('#wCal').getBoundingClientRect(), pr=$('#phone').getBoundingClientRect();
    $('#app-calendar').style.transformOrigin=((r.left+r.width/2-pr.left)/pr.width*100)+'% '+((r.top+r.height/2-pr.top)/pr.height*100)+'%';
    openApp('calendar');
  });
  refreshCal(); setInterval(refreshCal,30000);

})();
</script>
</body>
</html>
