<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 iPhone">
<title>내 iPhone</title>
<style>
  :root{ --blue:#007aff; --red:#ff3b30; --green:#34c759; --sub:#8e8e93; --line:#d8d8dc; --bg:#f2f2f7; --card:#fff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;height:100%;background:#000;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#000}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hide{display:none!important}
  #phone{position:fixed;inset:0;overflow:hidden;background:#111;--hb:26px}

  /* PC처럼 넓은 화면에서는 아이폰 13 비율(390×844)의 액자로 표시 */
  @media (min-width:500px){
    html,body{display:flex;align-items:center;justify-content:center;background:#1a1a1f}
    #phone{position:relative;inset:auto;height:min(844px,calc(100vh - 40px));aspect-ratio:390/844;
      border-radius:47px;box-shadow:0 0 0 10px #000,0 0 0 12px #3a3a3f,0 24px 60px rgba(0,0,0,.5)}
  }

  /* ================= 잠금화면 ================= */
  #lock,#home{position:absolute;inset:0;color:#fff;
    background:linear-gradient(160deg,#5b6dee 0%,#9b59d0 45%,#ff7eb3 100%)}
  #lock{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("lock.jpg") center/cover no-repeat}
  #lock{z-index:50;transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  #lock.gone{transform:translateY(-105%);pointer-events:none}
  .lk-lockicon{margin-top:calc(env(safe-area-inset-top) + 54px);opacity:.9}
  .lk-date{font-size:20px;font-weight:600;margin-top:10px;opacity:.92}
  .lk-time{font-size:88px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin-top:2px;
    text-shadow:0 2px 20px rgba(0,0,0,.15)}
  .lk-hint{margin-top:auto;margin-bottom:64px;font-size:16px;opacity:.85;animation:pulse 2.2s ease-in-out infinite}
  .lk-bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;opacity:.9}
  @keyframes pulse{50%{opacity:.35}}
  /* 비밀번호 키패드 */
  #pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top) + 100px);
    background:rgba(0,0,0,.3);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .25s;cursor:default}
  #pw.show{opacity:1;pointer-events:auto}
  #pw .pt{font-size:20px;font-weight:500}
  .dots{display:flex;gap:22px;margin:20px 0 70px}
  .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}
  .dots i.on{background:#fff}
  .dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
  .kp{display:grid;grid-template-columns:repeat(3,74px);gap:16px 22px}
  .kp button{width:74px;height:74px;border-radius:50%;border:.5px solid rgba(255,255,255,.28);color:#fff;
    background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;
    font-size:34px;font-weight:300;transition:background .15s}
  .kp button small{font-size:10px;font-weight:700;letter-spacing:2px;margin-top:3px;min-height:10px}
  .kp button:active{background:rgba(255,255,255,.5)}
  .pwfoot{width:calc(3*74px + 2*22px);display:flex;justify-content:space-between;margin-top:30px}
  .pwfoot button{background:none;border:0;color:#fff;font-size:17px;padding:8px 4px}
  .lk-date,.lk-time,.lk-lockicon{transition:opacity .25s}
  #lock.pwmode .lk-date,#lock.pwmode .lk-time,#lock.pwmode .lk-lockicon{opacity:0}
  #lock.pwmode .lk-hint{animation:none;opacity:0}

  /* ================= 홈화면 ================= */
  #home{z-index:1}
  .sb{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 26px 0;font-weight:600;font-size:16px;height:calc(env(safe-area-inset-top) + 38px)}
  .sb .time{cursor:pointer}
  .widget{margin:18px 22px 6px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .widget .wd{font-size:14px;opacity:.9}
  .widget .wt{font-size:40px;font-weight:700;letter-spacing:-1px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:20px 18px}
  .ico{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font-size:12px;padding:0}
  .ico .sq{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .ico:active .sq{transform:scale(.92);filter:brightness(.9)}
  .ico svg{width:34px;height:34px}
  .ico span{text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .ico .sq{overflow:hidden}
  .ico .sq img{width:100%;height:100%;object-fit:cover;display:block}

  /* 홈 인디케이터 */
  #hb{position:absolute;bottom:0;left:0;right:0;height:var(--hb);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
  #hb i{display:block;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.9)}
  #hb.dark i{background:#000;opacity:.85}
  #hb.on{cursor:pointer}

  /* ================= 앱 공통 ================= */
  .app{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
    transform:scale(.3);opacity:0;pointer-events:none;border-radius:40px;
    transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s,border-radius .38s}
  .app.open{transform:scale(1);opacity:1;pointer-events:auto;border-radius:0}
  .appnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;min-height:56px;flex:none}
  .appnav .t{font-weight:600;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appnav .nb{background:none;border:0;color:var(--blue);font-size:17px;padding:6px 2px;min-width:44px}
  .appnav .nb.r{text-align:right}.appnav .nb.l{text-align:left}
  .appnav .nb.danger{color:var(--red)}
  .appnav .nb:disabled{color:var(--sub)}
  .big{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:0 18px 10px}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--hb) + 10px)}
  .group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
  .row{display:flex;gap:12px;padding:11px 14px;align-items:center;position:relative;cursor:pointer}
  .row:active{background:rgba(120,120,128,.14)}
  .row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:.5px;background:var(--line)}
  .av{width:44px;height:44px;border-radius:50%;flex:none;color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center}
  .row .b{flex:1;min-width:0}
  .row .n{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .p{color:var(--sub);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .row .tm{color:var(--sub);font-size:14px;flex:none;align-self:flex-start;margin-top:2px}
  .empty{text-align:center;color:var(--sub);padding:90px 28px;line-height:1.7;font-size:16px}
  .plus{background:none;border:0;color:var(--blue);font-size:30px;line-height:1;padding:0 4px;min-width:44px;text-align:right}

  /* ================= 채팅 ================= */
  #app-chat{background:#dfe7f1}
  #app-chat .appnav{background:rgba(223,231,241,.92)}
  #chatList{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg)}
  #chatRoom{display:flex;flex-direction:column;flex:1;min-height:0}
  #cmsgs{flex:1;overflow-y:auto;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
  .m{display:flex;gap:8px;max-width:84%;align-items:flex-end}
  .m.me{align-self:flex-end;flex-direction:row-reverse}
  .m .av{width:36px;height:36px;font-size:15px;align-self:flex-start}
  .m .nm{font-size:12px;color:#555;margin:0 4px 3px}
  .bub{padding:8px 12px;border-radius:16px;font-size:16px;line-height:1.38;white-space:pre-wrap;word-break:break-word;background:#fff}
  .me .bub{background:#ffe778;border-top-right-radius:4px}
  .them .bub{border-top-left-radius:4px}
  .m .mt{font-size:11px;color:#6b7785;flex:none}
  .cbar{display:flex;gap:8px;align-items:center;padding:8px 10px calc(var(--hb) + 6px);background:#fff;border-top:.5px solid var(--line)}
  .cbar input{flex:1;border:0;background:#f0f1f3;border-radius:18px;padding:9px 14px;outline:none;font-size:16px}
  .who{border:0;background:#e8eaee;border-radius:14px;font-size:13px;padding:7px 11px;font-weight:600;flex:none}
  .who.me{background:#ffe778}
  .sendb{border:0;background:var(--blue);color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
  .sendb:disabled{background:#c7c7cc}

  /* ================= 피드 ================= */
  #app-feed{background:#fff}
  .post{border-bottom:.5px solid var(--line);padding-bottom:12px}
  .ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
  .ph .av{width:34px;height:34px;font-size:14px}
  .ph .n{font-weight:600;font-size:15px;flex:1}
  .ph .del{border:0;background:none;color:var(--sub);font-size:13px}
  .post img.pi{width:100%;display:block;max-height:480px;object-fit:cover;background:#eee}
  .pa{display:flex;gap:14px;padding:10px 14px 2px}
  .pa button{background:none;border:0;padding:0;font-size:26px;line-height:1}
  .pa .liked{color:#ff2d55}
  .pt{padding:2px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .pd{padding:4px 14px 0;font-size:12px;color:var(--sub)}

  /* ================= 메모 ================= */
  #app-notes{background:#f2f2f7}
  .nview{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
  .nview svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nview svg.i3{fill:currentColor;stroke:none}
  .ntop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;flex:none}
  .cbtn{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#000;box-shadow:0 4px 16px rgba(0,0,0,.08);
    display:flex;align-items:center;justify-content:center;padding:0;flex:none}
  .cbtn.lg{width:56px;height:56px}
  .cbtn svg,.pillbtn svg,.tools svg{width:24px;height:24px}
  .ntitle{text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
  .ntitle b{font-size:17px}
  .ntitle span{font-size:15px;color:#8e8e93}
  .pillbtn,.tools,.nsearch{background:#fff;border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,.08);display:flex;align-items:center}
  .pillbtn{height:52px;padding:0 6px}
  .pillbtn button,.tools button{border:0;background:none;color:#000;width:52px;height:52px;display:flex;align-items:center;justify-content:center;padding:0}
  .tools{height:56px;padding:0 8px}
  .cbtn:active,.pillbtn button:active,.tools button:active{opacity:.55}
  .nscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 140px}
  .nsec{font-size:22px;font-weight:700;margin:22px 4px 10px}
  .ncard{background:#fff;border-radius:26px;overflow:hidden}
  .nrow{padding:14px 20px;position:relative;cursor:pointer}
  .nrow:active{background:rgba(120,120,128,.12)}
  .nrow+.nrow::before{content:"";position:absolute;top:0;left:20px;right:20px;height:.5px;background:#d8d8dc}
  .nrow .nt{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nrow .ns{font-size:15px;color:#8e8e93;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nrow .ns b{font-weight:400;color:#6c6c70;margin-right:8px}
  .nrow .nf{display:flex;align-items:center;gap:6px;font-size:15px;color:#8e8e93;margin-top:4px}
  .nempty{text-align:center;color:#8e8e93;padding:90px 20px;line-height:1.7}
  .nbar{position:absolute;left:16px;right:16px;bottom:calc(var(--hb) + 10px);display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:2}
  .nsearch{flex:1;height:56px;padding:0 18px;gap:10px;color:#6c6c70}
  .nsearch input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:17px}
  .nsearch svg{width:22px;height:22px;flex:none}
  #nText{flex:1;border:0;outline:none;background:none;padding:18px 24px 150px;font-size:17px;line-height:1.55;resize:none;color:#333}

  /* ================= 갤러리 ================= */
  #app-gallery{background:#fff}
  .gg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .gg button{padding:0;border:0;background:#eee;aspect-ratio:1;overflow:hidden}
  .gg img{width:100%;height:100%;object-fit:cover;display:block}
  #gView{position:absolute;inset:0;background:#000;z-index:5;display:flex;flex-direction:column}
  #gView .appnav .nb{color:#fff}
  #gView .appnav .t{color:#ddd;font-size:14px;font-weight:500}
  #gImg{flex:1;min-height:0;width:100%;object-fit:contain;padding-bottom:var(--hb)}

  /* ================= 전화 ================= */
  #app-phone{background:#fff}
  .ptab{display:flex;border-top:.5px solid var(--line);background:#f9f9f9;padding:6px 0 calc(var(--hb) + 2px);flex:none}
  .ptab button{flex:1;background:none;border:0;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px}
  .ptab button b{font-size:21px;font-weight:400}
  .ptab button.on{color:var(--blue)}
  #pBody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
  .disp{text-align:center;font-size:34px;min-height:48px;margin-top:20px;letter-spacing:1px;padding:0 20px;word-break:break-all}
  .addc{text-align:center;color:var(--blue);font-size:15px;min-height:22px;background:none;border:0;margin:4px auto 6px}
  .pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px 22px;justify-content:center;margin:6px 0 10px}
  .pad button{width:78px;height:78px;border-radius:50%;border:0;background:#e9e9ee;font-size:32px}
  .pad button:active{background:#c7c7cc}
  .pad .call{background:var(--green);color:#fff;font-size:28px}
  .pad .bk{background:none;font-size:26px;color:var(--sub)}
  .rc .n.miss{color:var(--red)}
  #calling{position:absolute;inset:0;z-index:6;background:linear-gradient(#2c2c34,#111);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:110px}
  #calling .cn{font-size:32px;font-weight:600}
  #calling .cs{opacity:.7;margin-top:8px;font-size:17px}
  #calling .end{margin-top:auto;margin-bottom:90px;width:72px;height:72px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;transform:rotate(135deg)}

  /* ================= 시트 / 토스트 ================= */
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
  .dim.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;top:40px;background:var(--bg);border-radius:14px 14px 0 0;z-index:61;
    transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .sheet.show{transform:translateY(0)}
  .sheet .appnav{padding-top:14px}
  .form{padding:6px 16px 20px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:auto}
  .field{background:#fff;border-radius:12px;padding:12px 14px}
  .field input,.field textarea{width:100%;border:0;outline:none;background:none;font-size:17px;resize:none}
  .field textarea{min-height:130px}
  .imgpick{display:block;text-align:center;color:var(--blue);font-size:17px;padding:6px;cursor:pointer}
  .imgpick img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:8px}
  .toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-90px);background:rgba(40,40,42,.94);
    color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;transition:transform .3s;z-index:90;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="phone">

  <!-- 잠금화면 -->
  <section id="lock">
    <svg class="lk-lockicon" width="22" height="28" viewBox="0 0 22 28" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="2" y="12" width="18" height="14" rx="3" fill="#fff" stroke="none"/><path d="M6 12V8a5 5 0 0110 0v4"/></svg>
    <div class="lk-date" id="lkDate"></div>
    <div class="lk-time" id="lkTime"></div>
    <div class="lk-hint">화면을 터치해서 열기</div>
    <div class="lk-bar"></div>
    <div id="pw">
      <div class="pt">암호 입력</div>
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="kp" id="kp">
        <button data-d="1">1<small></small></button>
        <button data-d="2">2<small>ABC</small></button>
        <button data-d="3">3<small>DEF</small></button>
        <button data-d="4">4<small>GHI</small></button>
        <button data-d="5">5<small>JKL</small></button>
        <button data-d="6">6<small>MNO</small></button>
        <button data-d="7">7<small>PQRS</small></button>
        <button data-d="8">8<small>TUV</small></button>
        <button data-d="9">9<small>WXYZ</small></button>
        <span></span>
        <button data-d="0">0<small></small></button>
      </div>
      <div class="pwfoot">
        <button id="pwEmer">긴급 상황</button>
        <button id="pwCancel">취소</button>
      </div>
    </div>
  </section>

  <!-- 홈화면 -->
  <section id="home">
    <div class="sb"><span class="time" id="hTime" title="누르면 잠금"></span><span>100% 🔋</span></div>
    <div class="widget"><div class="wd" id="wDate"></div><div class="wt" id="wTime"></div></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 채팅 -->
  <section class="app" id="app-chat">
    <div id="chatList">
      <div class="appnav"><span style="min-width:44px"></span><div class="t"></div><button class="plus" id="roomAdd">＋</button></div>
      <div class="scroll"><div class="big">채팅</div><div id="roomRows"></div></div>
    </div>
    <div id="chatRoom" class="hide">
      <div class="appnav"><button class="nb l" id="roomBack">‹ 목록</button><div class="t" id="roomName"></div><button class="nb r danger" id="roomDel">삭제</button></div>
      <div id="cmsgs"></div>
      <div class="cbar">
        <button class="who me" id="who">나</button>
        <input id="cText" placeholder="메시지 입력" autocomplete="off">
        <button class="sendb" id="cSend" disabled>↑</button>
      </div>
    </div>
  </section>

  <!-- 피드 -->
  <section class="app" id="app-feed">
    <div class="appnav"><span style="min-width:44px"></span><div class="t"></div><button class="plus" id="postAdd">＋</button></div>
    <div class="scroll"><div class="big">피드</div><div id="postRows"></div></div>
  </section>

  <!-- 메모 -->
  <section class="app" id="app-notes">
    <!-- 목록 화면 -->
    <div id="nList" class="nview">
      <div class="ntop">
        <button class="cbtn" id="nHome" aria-label="홈으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="ntitle"><b>모든 메모</b><span id="nCount"></span></div>
        <button class="cbtn" id="nMore" aria-label="더보기"><svg class="i3" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      </div>
      <div class="nscroll" id="noteRows"></div>
      <div class="nbar">
        <label class="nsearch">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
          <input id="nSearch" type="search" placeholder="검색" autocomplete="off">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg>
        </label>
        <button class="cbtn lg" id="noteAdd" aria-label="새 메모"><svg viewBox="0 0 24 24"><path d="M13 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-7"/><path d="M20.5 3.5a1.8 1.8 0 010 2.5L12 14.5l-3.5 1 1-3.5L18 3.5a1.8 1.8 0 012.5 0z"/></svg></button>
      </div>
    </div>

    <!-- 편집 화면 -->
    <div id="nEdit" class="nview hide">
      <div class="ntop">
        <button class="cbtn" id="noteBack" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="pillbtn">
          <button id="noteShare" aria-label="공유"><svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg></button>
          <button id="noteMore" aria-label="삭제 메뉴"><svg class="i3" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        </div>
      </div>
      <textarea id="nText"></textarea>
      <div class="nbar">
        <div class="tools">
          <button id="tCheck" aria-label="체크리스트"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M12 7h9M12 17h9"/></svg></button>
          <button id="tClip" aria-label="첨부"><svg viewBox="0 0 24 24"><path d="M20 11.5l-8 8a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/></svg></button>
          <button id="tPen" aria-label="마크업"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 16l3.5-9 3.5 9M9.8 13h4.4"/></svg></button>
        </div>
        <button class="cbtn lg" id="noteNew" aria-label="새 메모"><svg viewBox="0 0 24 24"><path d="M13 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-7"/><path d="M20.5 3.5a1.8 1.8 0 010 2.5L12 14.5l-3.5 1 1-3.5L18 3.5a1.8 1.8 0 012.5 0z"/></svg></button>
      </div>
    </div>
  </section>

  <!-- 갤러리 -->
  <section class="app" id="app-gallery">
    <div class="appnav"><span style="min-width:44px"></span><div class="t" id="gCount"></div><button class="plus" id="photoAdd">＋</button></div>
    <input type="file" id="gFile" accept="image/*" multiple class="hide">
    <div class="scroll"><div class="big">갤러리</div><div id="gGrid"></div></div>
    <div id="gView" class="hide">
      <div class="appnav"><button class="nb l" id="gClose">닫기</button><div class="t" id="gDate"></div><button class="nb r danger" id="gDel" style="color:#ff6b61">삭제</button></div>
      <img id="gImg" alt="">
    </div>
  </section>

  <!-- 전화 -->
  <section class="app" id="app-phone">
    <div class="appnav"><span style="min-width:44px"></span><div class="t" id="pTitle"></div><button class="plus hide" id="contactAdd">＋</button></div>
    <div id="pBody"></div>
    <div class="ptab" id="ptab">
      <button data-t="recent"><b>🕘</b>최근 기록</button>
      <button data-t="contacts"><b>👤</b>연락처</button>
      <button data-t="keypad"><b>⌗</b>키패드</button>
    </div>
    <div id="calling" class="hide">
      <div class="cn" id="callName"></div>
      <div class="cs" id="callSt">전화 거는 중…</div>
      <button class="end" id="callEnd">☎</button>
    </div>
  </section>

  <!-- 공용 시트 -->
  <div class="dim" id="dim"></div>
  <section class="sheet" id="sheet">
    <div class="appnav"><button class="nb l" id="shCancel">취소</button><div class="t" id="shTitle"></div><button class="nb r" id="shSave" style="font-weight:600">저장</button></div>
    <div class="form" id="shForm"></div>
  </section>

  <div id="hb"><i></i></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const DAYS = ['일','월','화','수','목','금','토'];
  const COLORS = ['#ff9500','#34c759','#5856d6','#ff2d55','#00b8a9','#af52de','#007aff','#a2845e'];

  /* ---------- 저장소 ---------- */
  const DB = {
    get(k,d){ try{ const v = JSON.parse(localStorage.getItem('myphone.'+k)); return v==null ? d : v; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem('myphone.'+k, JSON.stringify(v)); return true; }
              catch(e){ toast('저장 공간이 부족해요. 사진을 몇 장 지워주세요'); return false; } }
  };
  let chats = DB.get('chats',[]), posts = DB.get('posts',[]), notes = DB.get('notes',[]),
      photos = DB.get('photos',[]), recents = DB.get('recents',[]), contacts = DB.get('contacts',[]);

  /* ---------- 유틸 ---------- */
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const color = name => { let h=0; for(const c of String(name)) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
  const hm = t => { const d=new Date(t); return d.getHours()+':'+pad(d.getMinutes()); };
  const ago = t => {
    const d=(Date.now()-t)/1000;
    if(d<60) return '방금'; if(d<3600) return Math.floor(d/60)+'분 전'; if(d<86400) return Math.floor(d/3600)+'시간 전';
    const x=new Date(t); return (x.getMonth()+1)+'/'+x.getDate();
  };
  const full = t => { const d=new Date(t); return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. '+hm(t); };
  let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2000); }
  function readImage(file, max, q){
    max = max||900; q = q||.72;
    return new Promise((res,rej)=>{
      const fr=new FileReader();
      fr.onload=()=>{ const img=new Image();
        img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
          c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
        img.onerror=rej; img.src=fr.result; };
      fr.onerror=rej; fr.readAsDataURL(file);
    });
  }

  /* ---------- 시계 ---------- */
  function tick(){
    const d=new Date(), t=d.getHours()+':'+pad(d.getMinutes());
    const ds=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';
    $('#lkTime').textContent=t; $('#lkDate').textContent=ds;
    $('#hTime').textContent=t; $('#wTime').textContent=t; $('#wDate').textContent=ds;
  }
  tick(); setInterval(tick,10000);

  /* ---------- 잠금 / 홈 ---------- */
  const lock = $('#lock'), PASSCODE = '0114';
  let entered = '';
  function unlock(){ lock.classList.add('gone'); hidePw(); }
  function relock(){ closeApp(); lock.classList.remove('gone'); }
  function showPw(){ entered=''; drawDots(); $('#pw').classList.add('show'); lock.classList.add('pwmode'); }
  function hidePw(){ $('#pw').classList.remove('show'); lock.classList.remove('pwmode'); entered=''; drawDots(); }
  function drawDots(){ $('#dots').querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on', i<entered.length)); $('#pwCancel').textContent = entered.length ? '삭제' : '취소'; }
  lock.addEventListener('click', e=>{ if(!e.target.closest('#pw')) showPw(); });
  let ty=null;
  lock.addEventListener('touchstart', e=>{ ty=e.touches[0].clientY; }, {passive:true});
  lock.addEventListener('touchend', e=>{ if(ty!==null && ty-e.changedTouches[0].clientY>60 && !e.target.closest('#pw')) showPw(); ty=null; });
  $('#kp').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b || !b.dataset.d || entered.length>=4) return;
    entered+=b.dataset.d; drawDots();
    if(entered.length===4){
      if(entered===PASSCODE){ setTimeout(unlock,150); }
      else { const d=$('#dots'); d.classList.add('shake'); setTimeout(()=>{ d.classList.remove('shake'); entered=''; drawDots(); },450); }
    }
  });
  $('#pwCancel').addEventListener('click', ()=>{ if(entered.length){ entered=entered.slice(0,-1); drawDots(); } else hidePw(); });
  $('#pwEmer').addEventListener('click', ()=>toast('긴급 통화는 지원되지 않아요'));
  $('#hTime').addEventListener('click', relock);

  /* ---------- 앱 아이콘 ---------- */
  const APPS = [
    {id:'chat',   name:'채팅',  img:'icon-chat.png',  bg:'linear-gradient(160deg,#4de3b9,#14a085)',
      svg:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.6 6.2L4.8 21l4.2-2.2c1 .2 2 .3 3 .3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/><circle cx="8" cy="11" r="1.2" fill="#14a085"/><circle cx="12" cy="11" r="1.2" fill="#14a085"/><circle cx="16" cy="11" r="1.2" fill="#14a085"/></svg>'},
    {id:'feed',   name:'피드',  img:'icon-feed.png',  bg:'linear-gradient(160deg,#7f5af0,#ff6ac1)',
      svg:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.800-8 11-8 11z"/></svg>'},
    {id:'notes',  name:'메모',  img:'icon-notes.png', bg:'linear-gradient(#ffe066,#ffc800)',
      svg:'<svg viewBox="0 0 24 24"><g stroke="#8a6d00" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h8"/></g></svg>'},
    {id:'gallery',name:'갤러리', img:'icon-gallery.png', bg:'#fff',
      svg:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2.6" fill="#ff9f0a"/><path d="M2 21l6.500-9 4 5 3-3.500L22 21z" fill="#34c759"/></svg>'},
    {id:'phone',  name:'전화',  img:'icon-phone.png',  bg:'linear-gradient(#4cd964,#22b33e)',
      svg:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M6.6 10.8c1.4 2.8 3.800 5.100 6.600 6.600l2.200-2.200c.3-.3.7-.4 1-.2 1.100.4 2.300.6 3.600.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.600 21 3 13.400 3 4c0-.6.4-1 1-1h3.500c.6 0 1 .4 1 1 0 1.300.2 2.500.6 3.600.1.3 0 .7-.2 1z"/></svg>'}
  ];
  $('#grid').innerHTML = APPS.map(a =>
    '<button class="ico" data-app="'+a.id+'"><div class="sq" style="background:'+a.bg+'">'+a.svg+
    (a.img ? '<img src="'+a.img+'" alt="" style="display:none">' : '')+
    '</div><span>'+a.name+'</span></button>').join('');
  document.querySelectorAll('#grid .sq img').forEach(im=>{
    im.addEventListener('load', ()=>{
      const sq=im.parentNode; sq.style.background='none';
      const sv=sq.querySelector('svg'); if(sv) sv.remove();
      im.style.display='block';
    });
  });

  /* ---------- 앱 열기/닫기 ---------- */
  let current = null;
  const R = {};   // 각 앱의 render 함수
  $('#grid').addEventListener('click', e=>{
    const b=e.target.closest('.ico'); if(!b) return;
    const r=b.getBoundingClientRect(), pr=$('#phone').getBoundingClientRect();
    const app=$('#app-'+b.dataset.app);
    app.style.transformOrigin=((r.left+r.width/2-pr.left)/pr.width*100)+'% '+((r.top+r.height/2-pr.top)/pr.height*100)+'%';
    openApp(b.dataset.app);
  });
  function openApp(id){
    current=id; $('#app-'+id).classList.add('open');
    $('#hb').classList.add('on','dark'); (R[id]||function(){})();
  }
  function closeApp(){
    if(!current) return;
    if(current==='phone') endCall(true);
    $('#app-'+current).classList.remove('open'); current=null;
    $('#hb').classList.remove('on','dark'); closeSheet(); document.activeElement && document.activeElement.blur();
  }
  $('#hb').addEventListener('click', closeApp);

  /* ---------- 공용 시트 ---------- */
  let shCfg=null, shVals={};
  function openSheet(cfg){
    shCfg=cfg; shVals={};
    $('#shTitle').textContent=cfg.title;
    $('#shForm').innerHTML = cfg.fields.map((f,i)=>{
      const v = f.val||''; shVals[f.key]=v;
      if(f.type==='area') return '<div class="field"><textarea data-k="'+f.key+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea></div>';
      if(f.type==='image') return '<div class="field"><label class="imgpick"><img class="hide" data-pv="'+f.key+'" alt=""><span>사진 선택</span><input type="file" accept="image/*" data-k="'+f.key+'" class="hide"></label></div>';
      return '<div class="field"><input data-k="'+f.key+'" type="'+(f.type||'text')+'" placeholder="'+esc(f.ph||'')+'" value="'+esc(v)+'"'+(f.max?' maxlength="'+f.max+'"':'')+'></div>';
    }).join('');
    $('#shSave').textContent = cfg.saveLabel||'저장';
    checkSheet();
    $('#dim').classList.add('show'); $('#sheet').classList.add('show');
    const first=$('#shForm [data-k]:not([type=file])'); if(first) setTimeout(()=>first.focus(),380);
  }
  function closeSheet(){ $('#dim').classList.remove('show'); $('#sheet').classList.remove('show'); shCfg=null; }
  function checkSheet(){
    if(!shCfg) return;
    $('#shSave').disabled = shCfg.fields.some(f => f.req && !String(shVals[f.key]||'').trim());
  }
  $('#shForm').addEventListener('input', e=>{
    const k=e.target.dataset.k; if(!k || e.target.type==='file') return; shVals[k]=e.target.value; checkSheet();
  });
  $('#shForm').addEventListener('change', async e=>{
    if(e.target.type!=='file' || !e.target.files[0]) return;
    try{
      const data=await readImage(e.target.files[0]); const k=e.target.dataset.k; shVals[k]=data;
      const pv=$('#shForm [data-pv="'+k+'"]'); pv.src=data; pv.classList.remove('hide'); e.target.parentNode.querySelector('span').textContent='다른 사진 선택';
      checkSheet();
    }catch(err){ toast('사진을 불러오지 못했어요'); }
  });
  $('#shSave').addEventListener('click', ()=>{ if(!shCfg) return; const cb=shCfg.onSave, v=Object.assign({},shVals); closeSheet(); cb(v); });
  $('#shCancel').addEventListener('click', closeSheet);
  $('#dim').addEventListener('click', closeSheet);

  /* =====================================================
     채팅
  ===================================================== */
  let roomId=null, sender='me';
  R.chat = function(){
    const inRoom = !!roomId;
    $('#chatList').classList.toggle('hide', inRoom); $('#chatRoom').classList.toggle('hide', !inRoom);
    if(!inRoom){
      const items=chats.slice().sort((a,b)=>lastAt(b)-lastAt(a));
      $('#roomRows').innerHTML = items.length ? '<div class="group">'+items.map(r=>{
        const l=r.msgs[r.msgs.length-1];
        return '<div class="row" data-id="'+r.id+'"><div class="av" style="background:'+color(r.name)+'">'+esc(r.name[0])+'</div>'+
               '<div class="b"><div class="n">'+esc(r.name)+'</div><div class="p">'+(l?esc(l.text):'대화를 시작해보세요')+'</div></div>'+
               '<div class="tm">'+(l?ago(l.at):'')+'</div></div>';
      }).join('')+'</div>' : '<div class="empty">채팅방이 없어요<br>오른쪽 위 ＋ 로 새 채팅방을 만들어보세요</div>';
    } else {
      const r=chats.find(x=>x.id===roomId); if(!r){ roomId=null; return R.chat(); }
      $('#roomName').textContent=r.name; renderMsgs();
    }
  };
  const lastAt = r => r.msgs.length ? r.msgs[r.msgs.length-1].at : r.created;
  function renderMsgs(){
    const r=chats.find(x=>x.id===roomId); if(!r) return;
    $('#cmsgs').innerHTML = r.msgs.map(m=>{
      if(m.from==='me') return '<div class="m me"><div class="bub">'+esc(m.text)+'</div><div class="mt">'+hm(m.at)+'</div></div>';
      return '<div class="m them"><div class="av" style="background:'+color(r.name)+'">'+esc(r.name[0])+'</div><div><div class="nm">'+esc(r.name)+'</div>'+
             '<div style="display:flex;gap:6px;align-items:flex-end"><div class="bub">'+esc(m.text)+'</div><div class="mt">'+hm(m.at)+'</div></div></div></div>';
    }).join('');
    const s=$('#cmsgs'); s.scrollTop=s.scrollHeight;
  }
  $('#roomAdd').addEventListener('click', ()=>openSheet({title:'새 채팅방', saveLabel:'만들기',
    fields:[{key:'name',ph:'채팅방(상대) 이름',req:true,max:20}],
    onSave:v=>{ const r={id:uid(),name:v.name.trim(),created:Date.now(),msgs:[]}; chats.push(r); DB.set('chats',chats); roomId=r.id; R.chat(); }}));
  $('#roomRows').addEventListener('click', e=>{ const r=e.target.closest('.row'); if(r){ roomId=r.dataset.id; R.chat(); } });
  $('#roomBack').addEventListener('click', ()=>{ roomId=null; R.chat(); });
  $('#roomDel').addEventListener('click', ()=>{ if(confirm('이 채팅방을 삭제할까요?')){ chats=chats.filter(r=>r.id!==roomId); DB.set('chats',chats); roomId=null; R.chat(); } });
  $('#who').addEventListener('click', ()=>{ sender = sender==='me'?'them':'me'; const w=$('#who'); w.textContent = sender==='me'?'나':'상대'; w.classList.toggle('me', sender==='me'); });
  $('#cText').addEventListener('input', ()=>{ $('#cSend').disabled = !$('#cText').value.trim(); });
  function sendMsg(){
    const t=$('#cText').value.trim(); if(!t) return; const r=chats.find(x=>x.id===roomId); if(!r) return;
    r.msgs.push({from:sender,text:t.slice(0,1000),at:Date.now()}); DB.set('chats',chats);
    $('#cText').value=''; $('#cSend').disabled=true; renderMsgs();
  }
  $('#cSend').addEventListener('click', sendMsg);
  $('#cText').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); sendMsg(); } });

  /* =====================================================
     피드
  ===================================================== */
  R.feed = function(){
    const items=posts.slice().sort((a,b)=>b.at-a.at);
    $('#postRows').innerHTML = items.length ? items.map(p=>
      '<div class="post" data-id="'+p.id+'"><div class="ph"><div class="av" style="background:'+color('나')+'">나</div><div class="n">나</div><button class="del" data-a="del">삭제</button></div>'+
      (p.img?'<img class="pi" src="'+esc(p.img)+'" alt="">':'')+
      '<div class="pa"><button data-a="like" class="'+(p.liked?'liked':'')+'">'+(p.liked?'♥':'♡')+'</button></div>'+
      (p.text?'<div class="pt">'+esc(p.text)+'</div>':'')+'<div class="pd">'+ago(p.at)+'</div></div>'
    ).join('') : '<div class="empty">아직 게시물이 없어요<br>오른쪽 위 ＋ 로 첫 게시물을 올려보세요</div>';
  };
  $('#postAdd').addEventListener('click', ()=>openSheet({title:'새 게시물', saveLabel:'공유',
    fields:[{key:'img',type:'image'},{key:'text',type:'area',ph:'문구를 입력하세요…',req:false}],
    onSave:v=>{
      if(!v.img && !String(v.text||'').trim()){ toast('사진이나 문구를 입력해 주세요'); return; }
      posts.push({id:uid(),text:String(v.text||'').trim(),img:v.img||'',liked:false,at:Date.now()});
      if(DB.set('posts',posts)) toast('게시물을 공유했어요'); else posts.pop();
      R.feed();
    }}));
  $('#postRows').addEventListener('click', e=>{
    const a=e.target.dataset.a, el=e.target.closest('.post'); if(!a||!el) return; const p=posts.find(x=>x.id===el.dataset.id); if(!p) return;
    if(a==='like'){ p.liked=!p.liked; DB.set('posts',posts); R.feed(); }
    if(a==='del' && confirm('게시물을 삭제할까요?')){ posts=posts.filter(x=>x!==p); DB.set('posts',posts); R.feed(); }
  });

  /* =====================================================
     메모
  ===================================================== */
  let noteId=null, nTimer=null, nQuery='';
  const ICON_FOLDER='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';
  const WD=['일','월','화','수','목','금','토'];
  const dayDiff = t => { const sod=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); return Math.round((sod(new Date())-sod(new Date(t)))/86400000); };
  function noteDate(t){
    const d=new Date(t), df=dayDiff(t);
    if(df<=0){ const h=d.getHours(); return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(d.getMinutes()); }
    if(df===1) return '어제';
    if(df<7) return WD[d.getDay()]+'요일';
    return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.';
  }
  const noteGroup = t => { const df=dayDiff(t); return df<=0?'오늘':df<=7?'이전 7일':df<=30?'이전 30일':'이전'; };

  R.notes = function(){
    const ed=!!noteId; $('#nList').classList.toggle('hide',ed); $('#nEdit').classList.toggle('hide',!ed);
    if(ed) return;
    const q=nQuery.trim().toLowerCase();
    const items=notes.filter(n=>n.text.trim() && (!q || n.text.toLowerCase().includes(q))).sort((a,b)=>b.at-a.at);
    $('#nCount').textContent = notes.filter(n=>n.text.trim()).length+'개의 메모';
    if(!items.length){
      $('#noteRows').innerHTML='<div class="nempty">'+(q?'검색 결과가 없어요':'메모가 없어요<br>오른쪽 아래 버튼으로 새 메모를 써보세요')+'</div>'; return;
    }
    const groups={};
    items.forEach(n=>{ const g=noteGroup(n.at); (groups[g]=groups[g]||[]).push(n); });
    $('#noteRows').innerHTML = ['오늘','이전 7일','이전 30일','이전'].filter(g=>groups[g]).map(g=>
      '<div class="nsec">'+g+'</div><div class="ncard">'+groups[g].map(n=>{
        const lines=n.text.split('\n').map(s=>s.trim()).filter(Boolean);
        const title=lines[0]||'새로운 메모', rest=lines.slice(1).join(' ');
        return '<div class="nrow" data-id="'+n.id+'"><div class="nt">'+esc(title)+'</div>'+
               '<div class="ns"><b>'+noteDate(n.at)+'</b>'+esc(rest||'추가 텍스트 없음')+'</div>'+
               '<div class="nf">'+ICON_FOLDER+'메모</div></div>';
      }).join('')+'</div>').join('');
  };

  function openNote(id, focus){
    noteId=id; R.notes(); const n=notes.find(x=>x.id===id); $('#nText').value=n?n.text:'';
    if(focus) setTimeout(()=>$('#nText').focus(),50);
  }
  function flushNote(){
    clearTimeout(nTimer); const n=notes.find(x=>x.id===noteId); if(!n) return;
    n.text=$('#nText').value; n.at=Date.now(); DB.set('notes',notes);
  }
  function leaveNote(){
    flushNote(); const n=notes.find(x=>x.id===noteId);
    if(n && !n.text.trim()){ notes=notes.filter(x=>x!==n); DB.set('notes',notes); }
    noteId=null; document.activeElement && document.activeElement.blur(); R.notes();
  }
  function newNote(){ const n={id:uid(),text:'',at:Date.now()}; notes.push(n); openNote(n.id,true); }

  $('#nHome').addEventListener('click', closeApp);
  $('#nMore').addEventListener('click', ()=>{ if(notes.length && confirm('모든 메모를 삭제할까요? 되돌릴 수 없어요.')){ notes=[]; DB.set('notes',notes); R.notes(); } });
  $('#nSearch').addEventListener('input', e=>{ nQuery=e.target.value; R.notes(); });
  $('#noteAdd').addEventListener('click', newNote);
  $('#noteRows').addEventListener('click', e=>{ const r=e.target.closest('.nrow'); if(r) openNote(r.dataset.id,false); });
  $('#nText').addEventListener('input', ()=>{ clearTimeout(nTimer); nTimer=setTimeout(flushNote,400); });
  $('#noteBack').addEventListener('click', leaveNote);
  $('#noteNew').addEventListener('click', ()=>{ leaveNote(); newNote(); });
  $('#noteMore').addEventListener('click', ()=>{
    if(confirm('이 메모를 삭제할까요?')){ clearTimeout(nTimer); notes=notes.filter(x=>x.id!==noteId); DB.set('notes',notes); noteId=null; R.notes(); }
  });
  $('#noteShare').addEventListener('click', async ()=>{
    const t=$('#nText').value; if(!t.trim()) return;
    try{ if(navigator.share){ await navigator.share({text:t}); } else { await navigator.clipboard.writeText(t); toast('메모를 복사했어요'); } }catch(e){}
  });
  $('#tCheck').addEventListener('click', ()=>{
    const ta=$('#nText'), v=ta.value, s=ta.selectionStart, ls=s>0 ? v.lastIndexOf('\n',s-1)+1 : 0;
    ta.value=v.slice(0,ls)+'☐ '+v.slice(ls); ta.selectionStart=ta.selectionEnd=s+2; ta.focus(); ta.dispatchEvent(new Event('input'));
  });
  $('#tClip').addEventListener('click', ()=>toast('첨부는 아직 지원하지 않아요'));
  $('#tPen').addEventListener('click', ()=>toast('마크업은 아직 지원하지 않아요'));

  /* =====================================================
     갤러리
  ===================================================== */
  let viewId=null;
  R.gallery = function(){
    const items=photos.slice().sort((a,b)=>b.at-a.at);
    $('#gCount').textContent = items.length ? '사진 '+items.length+'장' : '';
    $('#gGrid').innerHTML = items.length ? '<div class="gg">'+items.map(p=>'<button data-id="'+p.id+'"><img src="'+esc(p.img)+'" alt=""></button>').join('')+'</div>'
      : '<div class="empty">사진이 없어요<br>오른쪽 위 ＋ 로 사진을 추가해보세요</div>';
  };
  $('#photoAdd').addEventListener('click', ()=>$('#gFile').click());
  $('#gFile').addEventListener('change', async e=>{
    const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
    let added=0;
    for(const f of files){
      try{ const img=await readImage(f,1000,.75); photos.push({id:uid(),img,at:Date.now()});
           if(!DB.set('photos',photos)){ photos.pop(); break; } added++; }
      catch(err){ toast('불러오지 못한 사진이 있어요'); }
    }
    if(added) toast('사진 '+added+'장을 저장했어요'); R.gallery();
  });
  $('#gGrid').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return; const p=photos.find(x=>x.id===b.dataset.id); if(!p) return;
    viewId=p.id; $('#gImg').src=p.img; $('#gDate').textContent=full(p.at); $('#gView').classList.remove('hide');
  });
  $('#gClose').addEventListener('click', ()=>{ $('#gView').classList.add('hide'); viewId=null; });
  $('#gDel').addEventListener('click', ()=>{ if(confirm('이 사진을 삭제할까요?')){ photos=photos.filter(p=>p.id!==viewId); DB.set('photos',photos); $('#gView').classList.add('hide'); viewId=null; R.gallery(); } });

  /* =====================================================
     전화
  ===================================================== */
  let ptab='keypad', dial='', callT=null, callStart=0, callWho=null;
  const nameOf = num => { const c=contacts.find(c=>c.num===num); return c?c.name:''; };
  R.phone = function(){
    $('#ptab').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.t===ptab));
    $('#contactAdd').classList.toggle('hide', ptab!=='contacts');
    const body=$('#pBody');
    if(ptab==='keypad'){
      $('#pTitle').textContent='';
      body.innerHTML='<div class="disp" id="disp">'+esc(dial)+'</div>'+
        '<button class="addc" id="addNum">'+(dial?'연락처에 추가':'')+'</button>'+
        '<div class="pad">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+
        '<span></span><button class="call" data-k="call">☎</button><button class="bk" data-k="bk">'+(dial?'⌫':'')+'</button></div>';
    } else if(ptab==='recent'){
      $('#pTitle').textContent='';
      const items=recents.slice().sort((a,b)=>b.at-a.at);
      body.innerHTML='<div class="big">최근 기록</div>'+(items.length?'<div class="group rc">'+items.map(r=>
        '<div class="row" data-num="'+esc(r.num)+'"><div class="b"><div class="n">'+esc(nameOf(r.num)||r.num)+'</div><div class="p">발신'+(nameOf(r.num)?' · '+esc(r.num):'')+' · '+Math.floor(r.dur/60)+'분 '+(r.dur%60)+'초</div></div><div class="tm">'+ago(r.at)+'</div></div>'
      ).join('')+'</div>':'<div class="empty">통화 기록이 없어요<br>키패드에서 전화를 걸어보세요</div>');
    } else {
      $('#pTitle').textContent='';
      const items=contacts.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
      body.innerHTML='<div class="big">연락처</div>'+(items.length?'<div class="group">'+items.map(c=>
        '<div class="row" data-num="'+esc(c.num)+'" data-cid="'+c.id+'"><div class="av" style="background:'+color(c.name)+'">'+esc(c.name[0])+'</div><div class="b"><div class="n">'+esc(c.name)+'</div><div class="p">'+esc(c.num)+'</div></div></div>'
      ).join('')+'</div><div style="text-align:center;color:var(--sub);font-size:13px;margin-top:10px">연락처를 길게 누르면 삭제할 수 있어요</div>':'<div class="empty">저장된 연락처가 없어요<br>오른쪽 위 ＋ 로 추가해보세요</div>');
    }
  };
  $('#ptab').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b){ ptab=b.dataset.t; R.phone(); } });
  $('#pBody').addEventListener('click', e=>{
    if(e.target.id==='addNum'){ return addContact(dial); }
    const k=e.target.dataset.k;
    if(k){
      if(k==='call'){ if(dial) startCall(dial); }
      else if(k==='bk'){ dial=dial.slice(0,-1); R.phone(); }
      else if(dial.length<20){ dial+=k; R.phone(); }
      return;
    }
    const row=e.target.closest('.row'); if(row && !suppressClick) startCall(row.dataset.num);
  });
  // 연락처 길게 눌러 삭제
  let lpT=null, suppressClick=false;
  $('#pBody').addEventListener('touchstart', e=>{ const row=e.target.closest('.row[data-cid]'); if(!row) return;
    lpT=setTimeout(()=>{ suppressClick=true; if(confirm('이 연락처를 삭제할까요?')){ contacts=contacts.filter(c=>c.id!==row.dataset.cid); DB.set('contacts',contacts); R.phone(); } setTimeout(()=>suppressClick=false,300); },650); }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(ev=>$('#pBody').addEventListener(ev, ()=>clearTimeout(lpT), {passive:true}));
  $('#pBody').addEventListener('contextmenu', e=>{ const row=e.target.closest('.row[data-cid]'); if(!row) return; e.preventDefault();
    if(confirm('이 연락처를 삭제할까요?')){ contacts=contacts.filter(c=>c.id!==row.dataset.cid); DB.set('contacts',contacts); R.phone(); } });

  function addContact(num){
    openSheet({title:'새 연락처', fields:[{key:'name',ph:'이름',req:true,max:20},{key:'num',type:'tel',ph:'전화번호',req:true,val:num||'',max:20}],
      onSave:v=>{ contacts.push({id:uid(),name:v.name.trim(),num:v.num.trim()}); DB.set('contacts',contacts); toast('연락처를 저장했어요'); R.phone(); }});
  }
  $('#contactAdd').addEventListener('click', ()=>addContact(''));

  function startCall(num){
    callWho=num; callStart=Date.now();
    $('#callName').textContent = nameOf(num)||num; $('#callSt').textContent='전화 거는 중…';
    $('#calling').classList.remove('hide');
    callT=setInterval(()=>{ const s=Math.floor((Date.now()-callStart)/1000); if(s>=2) $('#callSt').textContent=pad(Math.floor(s/60))+':'+pad(s%60); },500);
  }
  function endCall(silent){
    if(callWho===null) return; clearInterval(callT);
    const dur=Math.max(0,Math.floor((Date.now()-callStart)/1000));
    recents.push({id:uid(),num:callWho,at:Date.now(),dur}); if(recents.length>100) recents.shift(); DB.set('recents',recents);
    callWho=null; $('#calling').classList.add('hide'); dial='';
    if(!silent){ ptab='recent'; R.phone(); toast('통화 기록이 저장됐어요'); }
  }
  $('#callEnd').addEventListener('click', ()=>endCall(false));
})();
</script>
</body>
</html>
